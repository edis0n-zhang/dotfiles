# Initialize (from https://github.com/merikan/.dotfiles/blob/main/install.conf.yaml)

- defaults:
    link:
        relink: true
        create: true
    shell:
        stderr: true

- clean:
    ~/:
      force: true

- link:
    ~/.profile: profile
    ~/.zprofile: zprofile
    ~/.zshenv: zshenv
    ~/.zshrc: zshrc
    ~/.gitconfig: gitconfig
